<style>
:root{--ink:#172033;--muted:#64748b;--primary:#14532d;--primary2:#166534;--surface:#fff;--soft:#f1f5f9;--line:#cbd5e1;--danger:#b91c1c;--focus:#f59e0b}*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--primary);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:1rem max(1rem,calc((100% - 1180px)/2))}h1{margin:0;font-size:1.45rem}h2,h3{line-height:1.2}nav{background:#fff;border-bottom:1px solid var(--line);padding:.6rem max(1rem,calc((100% - 1180px)/2));display:flex;gap:.5rem;position:sticky;top:0;z-index:3}main{max-width:1180px;margin:1.5rem auto;padding:0 1rem}.skip{position:absolute;left:-9999px}.skip:focus{left:1rem;top:1rem;background:#fff;padding:.5rem;z-index:10}.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem;box-shadow:0 1px 2px #0000000d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}.wide{grid-column:1/-1}label{display:block;font-weight:650;margin-bottom:.25rem}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #94a3b8;border-radius:7px;padding:.62rem;background:#fff}textarea{min-height:110px;resize:vertical}input:focus,select:focus,textarea:focus,button:focus{outline:3px solid color-mix(in srgb,var(--focus) 45%,transparent);outline-offset:2px}button{border:0;border-radius:7px;padding:.58rem .85rem;background:var(--primary2);color:#fff;cursor:pointer}button.secondary{background:#475569}button.light{background:#e2e8f0;color:#172033}button.danger{background:var(--danger)}button:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.65rem;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--soft)}.criterion{border-left:4px solid var(--primary2)}.descriptors{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;font-size:.9rem;color:#334155}.choice{display:flex;gap:.75rem;flex-wrap:wrap;margin:.75rem 0}.choice label{font-weight:500}.choice input{width:auto}.badge{display:inline-block;padding:.15rem .5rem;border-radius:999px;background:#e2e8f0;font-size:.78rem}.error{background:#fee2e2;color:#7f1d1d;border:1px solid #fca5a5;padding:.75rem;border-radius:8px}.success{background:#dcfce7;color:#14532d;border:1px solid #86efac;padding:.75rem;border-radius:8px}.steps{display:flex;gap:.3rem;overflow:auto;margin-bottom:1rem}.steps button{white-space:nowrap;background:#e2e8f0;color:#172033}.steps button.active{background:var(--primary2);color:#fff}.muted{color:var(--muted)}.hidden{display:none!important}@media(max-width:720px){.descriptors{grid-template-columns:1fr}header{align-items:flex-start;gap:1rem}.actions button{flex:1}}
</style>
